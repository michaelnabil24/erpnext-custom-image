name: Build ERPNext custom image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps.json
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

env:
  FRAPPE_BRANCH: version-16

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Image name and tag
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/erpnext-custom" >> "$GITHUB_ENV"
          echo "TAG=v16-$(date +%Y%m%d)-${GITHUB_SHA::7}-arm64" >> "$GITHUB_ENV"

      - name: Validate apps.json
        run: jq . apps.json

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          platforms: linux/arm64
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            CACHE_BUST=${{ github.run_id }}
          secret-files: |
            apps_json=apps.json
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:version-16

      - name: Smoke test (apps present)
        run: |
          docker run --rm --entrypoint ls "${IMAGE}:${TAG}" /home/frappe/frappe-bench/apps | tee apps.txt
          for a in frappe erpnext hrms telephony helpdesk erpnext_egypt_compliance; do
            grep -qx "$a" apps.txt || { echo "missing app: $a"; exit 1; }
          done
          echo "### Image: \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
